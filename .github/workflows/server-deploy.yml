name: server-deploy CI

on:
  # Auto-deploy the auth Worker whenever the server changes on main. The auth
  # server is high-blast-radius (a bad deploy can lock everyone out), so scope to
  # server/** — unrelated pushes (docs, admin-panel) don't trigger a redeploy.
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-deploy.yml'
  # Keep a manual trigger too (Actions tab -> Run workflow) to redeploy on demand
  # or deploy from another branch.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd server && npm ci

      - name: Build Server View
        run: cd server && npm run build

      - name: Run Migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'server'
          command: | 
            d1 migrations apply melody-auth --remote
            deploy --minify src/index.tsx
